<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXORA Tic Tac Toe</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🎮 NEXORA Tic-Tac-Toe</h1>

    <div class="modes">
        <button id="pvp">👥 Player vs Player</button>
        <button id="ai">🤖 Player vs AI</button>
    </div>

    <div class="status" id="status">Select a mode to begin</div>

    <div class="board" id="board">
        <div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>

    <button class="reset" id="reset">🔁 Restart Game</button>

</div>

<script src="script.js"></script>
</body>
</html>
